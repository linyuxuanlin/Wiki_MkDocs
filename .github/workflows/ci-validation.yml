name: ci-validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt -r requirements.txt

      - name: Validate translator syntax
        run: python -m py_compile tools/auto-translater.py

      - name: Verify full git history
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git rev-parse HEAD^

      - name: Build site
        run: mkdocs build --clean
