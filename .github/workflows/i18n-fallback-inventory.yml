name: i18n-fallback-inventory

on:
  push:
    branches:
      - agent/i18n-fallback-inventory

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build instrumented site
        run: mkdocs build --clean -f mkdocs.inventory.yml

      - name: Inventory fallback pages
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import html
          import re

          marker_re = re.compile(
              r'<!-- i18n-fallback source="([^"]+)" output="([^"]+)" path="([^"]+)" -->'
          )
          cjk_re = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          latin_re = re.compile(r'[A-Za-z]')

          counts = Counter()
          path_counts = Counter()
          active_paths = defaultdict(set)
          total_html = 0

          for page in Path('site').rglob('index.html'):
              total_html += 1
              text = page.read_text(encoding='utf-8')
              match = marker_re.search(text)
              if not match:
                  continue

              source, output, source_path = [html.unescape(x) for x in match.groups()]
              category = 'legacy' if source_path.startswith(('archive/', 'unlist/')) else 'active'
              counts[(output, category)] += 1
              path_counts[category] += 1
              if category == 'active':
                  active_paths[output].add(source_path)

          print('generated index.html:', total_html)
          print('all fallback pages:', sum(path_counts.values()))
          print('legacy fallback pages:', path_counts['legacy'])
          print('active fallback pages:', path_counts['active'])
          print('=== by locale/category ===')
          for key in sorted(counts):
              print(key, counts[key])

          common = set.intersection(*(active_paths[lang] for lang in ('en', 'es', 'ar')))
          en_only = active_paths['en'] - active_paths['es'] - active_paths['ar']
          print('active fallback source paths common to en/es/ar:', len(common))
          print('active fallback source paths en-only:', len(en_only))
          print('=== common active paths + source character profile ===')

          def source_file(path):
              for candidate in (Path('docs') / path, Path('docs/zh') / path):
                  if candidate.is_file():
                      return candidate
              return None

          common_profiles = []
          for source_path in sorted(common):
              src = source_file(source_path)
              if not src:
                  raise SystemExit(f'source file not found for {source_path}')
              raw = src.read_text(encoding='utf-8')
              cjk = len(cjk_re.findall(raw))
              latin = len(latin_re.findall(raw))
              ratio = cjk / max(cjk + latin, 1)
              common_profiles.append((source_path, cjk, latin, ratio))
              print(f'{source_path}\tCJK={cjk}\tLatin={latin}\tCJK_ratio={ratio:.3f}')

          print('=== en-only active paths + source character profile ===')
          en_profiles = []
          for source_path in sorted(en_only):
              src = source_file(source_path)
              if not src:
                  raise SystemExit(f'source file not found for {source_path}')
              raw = src.read_text(encoding='utf-8')
              cjk = len(cjk_re.findall(raw))
              latin = len(latin_re.findall(raw))
              ratio = cjk / max(cjk + latin, 1)
              en_profiles.append((source_path, cjk, latin, ratio))
              print(f'{source_path}\tCJK={cjk}\tLatin={latin}\tCJK_ratio={ratio:.3f}')

          if path_counts['legacy'] != 111:
              raise SystemExit(f'expected 111 known legacy fallbacks, got {path_counts["legacy"]}')
          if len(common) != 17:
              raise SystemExit(f'expected 17 common active fallback paths, got {len(common)}')
          if len(en_only) != 22:
              raise SystemExit(f'expected 22 en-only active fallback paths, got {len(en_only)}')
          if not all(ratio >= 0.35 for _, _, _, ratio in common_profiles):
              raise SystemExit('a common active fallback source is not clearly CJK-dominant')
          if not all(ratio < 0.10 for _, _, _, ratio in en_profiles):
              raise SystemExit('an en-only fallback source is not clearly Latin-dominant')
          PY
