name: integration-seo-i18n

on:
  push:
    branches:
      - agent/integration-seo-i18n

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check hook syntax
        run: python -m py_compile hooks/seo_metadata.py hooks/i18n_index_hygiene.py

      - name: Build composed site
        run: mkdocs build --clean -f mkdocs.integration.yml

      - name: Assert composed behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import re
          import xml.etree.ElementTree as ET

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          # #11: fallback copies are noindex, default and real translations are not.
          assert 'name="robots" content="noindex, follow"' in text('site/en/archive/nps/index.html')
          assert 'name="robots" content="noindex, follow"' not in text('site/archive/nps/index.html')
          translated = Path('site/en/ATTiny85调试记录/index.html')
          assert translated.is_file()
          assert 'name="robots" content="noindex, follow"' not in text(translated)

          # #12: no legacy fallback URLs or hreflang targets remain in sitemap.
          ns = {
              'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9',
              'xhtml': 'http://www.w3.org/1999/xhtml',
          }
          root = ET.parse('site/sitemap.xml').getroot()
          locs = [node.findtext('sm:loc', namespaces=ns) for node in root.findall('sm:url', ns)]
          alts = [
              link.attrib['href']
              for node in root.findall('sm:url', ns)
              for link in node.findall('xhtml:link', ns)
          ]

          def legacy_fallback(url):
              path = unquote(urlparse(url).path)
              return any(
                  path.startswith(f'/{lang}/{section}/')
                  for lang in ('en', 'es', 'ar')
                  for section in ('archive', 'unlist')
              )

          assert not [url for url in locs if legacy_fallback(url)]
          assert not [url for url in alts if legacy_fallback(url)]

          # #8: reuse the exact sample and HTML patterns validated in its own CI.
          candidates = list(Path('site/en').glob('RobotCtrl_Core*/index.html'))
          if not candidates:
              raise SystemExit('RobotCtrl_Core generated page not found')
          html = candidates[0].read_text(encoding='utf-8')
          match = re.search(r'<meta name="?description"? content="([^"]*)"', html)
          if not match:
              match = re.search(r'<meta name=description content="([^"]*)"', html)
          if not match:
              raise SystemExit('meta description not found')
          description = match.group(1)
          generic = 'To have an extensive knowledge of all things and integrate them into a coherent whole.'
          if description == generic:
              raise SystemExit('page still uses generic site description')
          if len(description) < 55 or len(description) > 155:
              raise SystemExit(f'unexpected description length: {len(description)}')

          print('combined hook + sitemap assertions passed')
          print('SEO sample:', description)
          PY
