name: integration-seo-canonical

on:
  push:
    branches:
      - agent/integration-seo-i18n

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check hook syntax
        run: python -m py_compile hooks/seo_metadata.py hooks/i18n_index_hygiene.py

      - name: Build composed site
        run: mkdocs build --clean -f mkdocs.integration.yml

      - name: Assert composed behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import re
          import xml.etree.ElementTree as ET

          def html(path):
              return Path(path).read_text(encoding='utf-8')

          canonical_re = re.compile(
              r'<link[^>]+(?:rel=["\']?canonical["\']?[^>]+href=["\']?([^"\' >]+)|href=["\']?([^"\' >]+)["\']?[^>]+rel=["\']?canonical["\']?)[^>]*>',
              re.I,
          )

          def canonical_path(path):
              match = canonical_re.search(html(path))
              if not match:
                  raise SystemExit(f'canonical missing: {path}')
              href = match.group(1) or match.group(2)
              return unquote(urlparse(href).path)

          # #11 canonical behavior.
          assert canonical_path('site/en/archive/nps/index.html') == '/archive/nps/'
          assert canonical_path('site/es/blog/2022-07-03-有限与无限世界/index.html') == '/blog/2022-07-03-有限与无限世界/'
          assert canonical_path('site/ar/机器学习入门-基础流程/index.html') == '/机器学习入门-基础流程/'
          assert canonical_path('site/archive/nps/index.html') == '/archive/nps/'
          assert canonical_path('site/en/Continuity_Test/index.html') == '/en/Continuity_Test/'

          # No noindex is used by the canonical strategy.
          for page in Path('site').rglob('index.html'):
              text = page.read_text(encoding='utf-8')
              if 'name="robots" content="noindex' in text or 'name=robots content=noindex' in text:
                  raise SystemExit(f'unexpected noindex: {page}')

          # #12 sitemap behavior.
          ns = {
              'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9',
              'xhtml': 'http://www.w3.org/1999/xhtml',
          }
          root = ET.parse('site/sitemap.xml').getroot()
          locs = [node.findtext('sm:loc', namespaces=ns) for node in root.findall('sm:url', ns)]
          alts = [
              link.attrib['href']
              for node in root.findall('sm:url', ns)
              for link in node.findall('xhtml:link', ns)
          ]

          def target_duplicate(url):
              path = unquote(urlparse(url).path)
              for lang in ('en', 'es', 'ar'):
                  prefix = f'/{lang}/'
                  if not path.startswith(prefix):
                      continue
                  relative = path[len(prefix):]
                  return relative.startswith(('archive/', 'unlist/', 'blog/')) or relative == '机器学习入门-基础流程/'
              return False

          if len(locs) != 1329:
              raise SystemExit(f'unexpected sitemap loc count: {len(locs)}')
          if [url for url in locs if target_duplicate(url)]:
              raise SystemExit('target duplicate loc remains')
          if [url for url in alts if target_duplicate(url)]:
              raise SystemExit('target duplicate hreflang remains')

          # #8 page-specific description behavior.
          candidates = list(Path('site/en').glob('RobotCtrl_Core*/index.html'))
          if not candidates:
              raise SystemExit('RobotCtrl_Core generated page not found')
          sample = html(candidates[0])
          match = re.search(r'<meta name="?description"? content="([^"]*)"', sample)
          if not match:
              match = re.search(r'<meta name=description content="([^"]*)"', sample)
          if not match:
              raise SystemExit('meta description not found')
          description = match.group(1)
          generic = 'To have an extensive knowledge of all things and integrate them into a coherent whole.'
          if description == generic or not 55 <= len(description) <= 155:
              raise SystemExit(f'invalid page-specific description: {description}')

          print('SEO + canonical + sitemap integration assertions passed')
          print('description sample:', description)
          PY
