name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt -r requirements.txt

      - name: Change permissions
        run: chmod 755 docs

      - name: Detect docs changes
        id: docs_changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- docs; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-i18n_translate
        if: steps.docs_changes.outputs.changed == 'true'
        env:
          # 设置环境变量
          ### API BASE:
          #CHATGPT_API_BASE: ${{ secrets.CHATGPT_API_BASE }}
          CHATGPT_API_BASE: ${{ secrets.URL_CHATANYWHERE }}
          #CHATGPT_API_BASE: ${{ secrets.URL_OPENAI_FAKE }}
          #CHATGPT_API_BASE: ${{ secrets.URL_OPENAI }}
          ### API KEY:
          #CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          #CHATGPT_API_KEY: ${{ secrets.KEY_CHATANYWHERE_IRIS }}
          CHATGPT_API_KEY: ${{ secrets.KEY_CHATANYWHERE_ME }}
          #CHATGPT_API_KEY: ${{ secrets.KEY_OPENAI_FAKE_LINYUXUANLIN52 }}
          #CHATGPT_API_KEY: ${{ secrets.KEY_OPENAI_FAKE_LISU }} #x
          #CHATGPT_API_KEY: ${{ secrets.KEY_OPENAI_LINYUXUANLIN52 }}
        run: python tools/auto-translater.py || true

      - name: Restore translated internal links
        run: |
          python tools/repair_malformed_internal_urls.py
          python tools/repair_malformed_internal_urls.py --check
          python tools/repair_translated_internal_links.py
          python tools/repair_translated_internal_links.py --check

      - name: Commit translated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated translation changes to commit."
            exit 0
          fi
          git config user.email "824676271@qq.com"
          git config user.name "linyuxuanlin"
          git add .
          git commit -m "Commit translated"

      - name: Push translated files
        run: |
          if git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD" | grep -q '^0$'; then
            echo "No new commit to push."
            exit 0
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deploy with MkDocs
        run: mkdocs gh-deploy --force
