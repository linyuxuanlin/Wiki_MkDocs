name: pr-check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check custom code syntax
        run: |
          node --check docs/javascripts/adsense.js
          node --check docs/javascripts/altium.js
          node --check docs/javascripts/mathjax.js
          node --check docs/javascripts/accessibility.js
          python -m py_compile hooks/seo_metadata.py hooks/i18n_index_hygiene.py tools/validate_site_output.py tools/repair_translated_internal_links.py tools/audit_internal_broken_links.py

      - name: Repair deterministic internal links
        run: |
          python tools/repair_translated_internal_links.py
          python tools/repair_translated_internal_links.py --check

      - name: Build site
        run: mkdocs build --clean

      - name: Validate generated site
        run: python tools/validate_site_output.py

      - name: Audit residual internal broken links
        run: python tools/audit_internal_broken_links.py
