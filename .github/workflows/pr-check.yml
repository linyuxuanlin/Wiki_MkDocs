name: pr-check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check custom JavaScript syntax
        run: |
          node --check docs/javascripts/adsense.js
          node --check docs/javascripts/altium.js
          node --check docs/javascripts/mathjax.js
          node --check docs/javascripts/accessibility.js

      - name: Build site
        run: mkdocs build --clean
